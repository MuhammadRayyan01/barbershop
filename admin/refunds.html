<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refunds &amp; Invoices | Pemon Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @media print { #admin-sidebar, #admin-topbar, .no-print { display: none !important; } main { margin: 0 !important; } }
  </style>
</head>
<body class="bg-[#f8f8fd] text-slate-900">

  <div id="admin-sidebar"></div>
  <div id="admin-topbar"></div>

  <main class="lg:ml-72 px-4 sm:px-8 py-8">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold">Kelola Refund &amp; Invoices</h1>
        <p class="text-sm text-slate-500 mt-1">Daftar pembatalan reservasi, permohonan pengembalian dana klien, dan status riwayat faktur invoice.</p>
      </div>
      <div class="flex gap-2 no-print">
        <button id="btn-csv" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-50 text-sm font-semibold hover:bg-indigo-100"><span class="material-symbols-outlined text-[18px]">download</span>Ekspor CSV</button>
        <button id="btn-print" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-50 text-sm font-semibold hover:bg-indigo-100"><span class="material-symbols-outlined text-[18px]">print</span>Cetak Rekap</button>
      </div>
    </div>

    <!-- Kartu ringkasan -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <p class="text-[11px] font-semibold tracking-wider text-slate-500">TOTAL PEMBATALAN</p>
        <p id="stat-total" class="text-3xl font-extrabold mt-1">0</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <p class="text-[11px] font-semibold tracking-wider text-slate-500">REFUND TELAH DIPROSES</p>
        <p id="stat-done" class="text-3xl font-extrabold mt-1 text-[#0d3b36]">Rp 0</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm">
        <p class="text-[11px] font-semibold tracking-wider text-slate-500">MENUNGGU KONFIRMASI</p>
        <p id="stat-wait" class="text-3xl font-extrabold mt-1">0 Antrean</p>
      </div>
    </section>

    <!-- Tabel -->
    <section class="bg-white rounded-2xl shadow-sm mt-6 overflow-hidden">
      <div class="flex flex-wrap items-center gap-3 p-4 no-print">
        <div class="flex items-center gap-2 bg-[#f8f8fd] rounded-xl px-4 py-2.5 flex-1 min-w-[240px]">
          <span class="material-symbols-outlined text-[18px] text-slate-500">search</span>
          <input id="search" type="text" placeholder="Cari nama klien, nomor transaksi, atau layanan..." class="w-full bg-transparent outline-none text-sm">
        </div>
        <select id="status-filter" class="bg-[#f8f8fd] rounded-xl px-4 py-2.5 text-sm font-semibold outline-none">
          <option value="all">Semua Status</option>
          <option value="waiting">Menunggu Refund</option>
          <option value="refunded">Selesai Refund</option>
          <option value="void">Invoice Dibatalkan</option>
        </select>
        <button class="inline-flex items-center gap-2 bg-[#f8f8fd] rounded-xl px-4 py-2.5 text-sm font-semibold"><span class="material-symbols-outlined text-[18px] text-slate-500">calendar_month</span>Bulan Ini</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[900px]">
          <thead class="bg-indigo-50/60 text-[11px] tracking-wider text-slate-500 uppercase">
            <tr>
              <th class="text-left font-semibold px-4 py-3 w-12">#</th>
              <th class="text-left font-semibold px-4 py-3">Name</th>
              <th class="text-left font-semibold px-4 py-3">Service Name</th>
              <th class="text-left font-semibold px-4 py-3">Price</th>
              <th class="text-left font-semibold px-4 py-3">Status</th>
              <th class="text-right font-semibold px-4 py-3">Action</th>
            </tr>
          </thead>
          <tbody id="ref-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-4 text-xs text-slate-500 no-print">
        <span id="range-label"></span>
        <!-- PHP nanti: pagination pakai ?page=N -->
        <div class="flex items-center gap-1">
          <button class="w-8 h-8 rounded-lg bg-[#0d3b36] text-white font-semibold">1</button>
          <button class="w-8 h-8 rounded-lg hover:bg-slate-100">2</button>
          <button class="px-3 py-1.5 rounded-lg hover:bg-slate-100">Berikutnya</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal invoice -->
  <div id="invoice-modal" class="modal hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 bg-indigo-50/60">
        <h3 class="font-bold text-lg flex items-center gap-2"><span class="material-symbols-outlined">receipt_long</span>Invoice</h3>
        <button data-close-modal class="p-1 rounded-lg hover:bg-white/70"><span class="material-symbols-outlined">close</span></button>
      </div>
      <dl id="invoice-body" class="px-6 py-5 text-sm grid grid-cols-3 gap-y-3"></dl>
      <div class="px-6 pb-5 flex justify-end">
        <button data-close-modal class="px-4 py-2 rounded-xl bg-slate-100 text-sm font-semibold text-slate-600 hover:bg-slate-200">Tutup</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/admin.js"></script>
  <script>
    initAdminShell('refunds', ['Studio Management', 'Administration Portal', 'Refunds & Invoices']);

    /* ------------------------------------------------------------
       DATA CONTOH
       Sumber nanti: reservation (batal) + payment + invoice
       Nanti ganti dengan: fetch('../includes/get_refunds.php')
       state: waiting  -> payment_status 'paid', reservation 'inactive' (belum dikembalikan)
              refunded -> payment_status 'refunded'
              void     -> invoice dibatalkan
       ------------------------------------------------------------ */
    const meta = { total: 6, doneAmount: 245000, rows: 12 };
    const refunds = [
      { id: 1, name: 'Kevin Adrian',    phone: '0878-5544-3322', ref: 'REF-2023-0891', service: 'Paket Ayah & Anak',        staff: 'Master Barber: Aris Thorne',  price: 90000,  state: 'waiting' },
      { id: 2, name: 'Rian Pratama',    phone: '0812-3344-9988', ref: 'REF-2023-0889', service: 'Haircut & Deluxe Wash',    staff: 'Stylist: Kenzo Tanaka',       price: 65000,  state: 'waiting' },
      { id: 3, name: 'Dimas Setiawan',  phone: '0857-1122-3344', ref: 'INV-2023-0880', service: 'Classic Haircut',          staff: 'Master Barber: Aris Thorne',  price: 50000,  state: 'refunded' },
      { id: 4, name: 'Farhan Ramadhan', phone: '0819-7788-9900', ref: 'INV-2023-0875', service: 'Shave & Beard Trim',       staff: 'Groomer: Tatsuya Mori',       price: 35000,  state: 'refunded' },
      { id: 5, name: 'Bayu Nugroho',    phone: '0821-4455-6677', ref: 'INV-2023-0862', service: 'Hair Coloring / Bleaching', staff: 'Colorist: Kenzo Tanaka',     price: 120000, state: 'refunded' },
      { id: 6, name: 'Satria Wijaya',   phone: '0813-8899-1122', ref: 'INV-2023-0850', service: 'Kids Haircut & Styling',   staff: 'Stylist: Takeshi Vance',      price: 45000,  state: 'void' },
    ];

    const STATE = {
      waiting:  { label: 'Menunggu Refund',     color: 'amber',  action: 'refund' },
      refunded: { label: 'Selesai Refund',      color: 'green',  action: 'invoice' },
      void:     { label: 'Invoice Dibatalkan',  color: 'indigo', action: 'invoice' },
    };

    const $body = document.getElementById('ref-body');
    const $search = document.getElementById('search');
    const $filter = document.getElementById('status-filter');

    // dari dashboard: refunds.html?q=Nama
    const preset = new URLSearchParams(location.search).get('q');
    if (preset) $search.value = preset;

    function visibleRows() {
      const q = $search.value.trim().toLowerCase();
      const f = $filter.value;
      return refunds.filter(r =>
        (f === 'all' || r.state === f) &&
        (!q || [r.name, r.ref, r.service].some(v => v.toLowerCase().includes(q)))
      );
    }

    function render() {
      const rows = visibleRows();
      $body.innerHTML = rows.length ? rows.map((r, i) => {
        const st = STATE[r.state];
        const btn = st.action === 'refund'
          ? `<button data-act="refund" data-id="${r.id}" class="px-4 py-2.5 rounded-lg bg-[#0d3b36] hover:bg-[#082724] text-white text-xs font-bold no-print">Proses Refund</button>`
          : `<button data-act="invoice" data-id="${r.id}" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-xs font-semibold no-print"><span class="material-symbols-outlined text-[16px]">receipt_long</span>Lihat Invoice</button>`;
        return `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-4 text-slate-500">${i + 1}</td>
          <td class="px-4 py-4">
            <p class="font-bold">${esc(r.name)}</p>
            <p class="text-xs text-slate-500">${esc(r.phone)} <span class="ml-2">&bull; ${esc(r.ref)}</span></p>
          </td>
          <td class="px-4 py-4"><p class="font-bold">${esc(r.service)}</p><p class="text-xs text-slate-500">${esc(r.staff)}</p></td>
          <td class="px-4 py-4 font-bold whitespace-nowrap">${rupiah(r.price)}</td>
          <td class="px-4 py-4">${chip(st.label, st.color, 'circle')}</td>
          <td class="px-4 py-4 text-right">${btn}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="6" class="px-4 py-10 text-center text-slate-500">Data tidak ditemukan.</td></tr>`;

      document.getElementById('stat-total').textContent = refunds.length;
      document.getElementById('stat-done').textContent = rupiah(meta.doneAmount);
      document.getElementById('stat-wait').textContent = `${refunds.filter(r => r.state === 'waiting').length} Antrean`;
      document.getElementById('range-label').textContent = `Baris 1 - ${rows.length} dari ${meta.rows} riwayat refund & invoice`;
    }

    $body.addEventListener('click', async e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const r = refunds.find(x => x.id === Number(btn.dataset.id));

      if (btn.dataset.act === 'refund') {
        const ok = await confirmDialog({ title: 'Proses refund?', message: `Kembalikan ${rupiah(r.price)} kepada ${r.name}. Tindakan ini mengubah status pembayaran menjadi refunded.`, okLabel: 'Proses Refund' });
        if (!ok) return;
        // PHP nanti: POST includes/process_refund.php -> UPDATE payment SET payment_status='refunded'
        r.state = 'refunded';
        meta.doneAmount += r.price;
        toast('Refund diproses');
        render();
      }
      if (btn.dataset.act === 'invoice') {
        // kolom ini = tabel `invoice` (customer_name, phone_number, total_payment, cancellation_deadline)
        document.getElementById('invoice-body').innerHTML = [
          ['No. Invoice', r.ref], ['Pelanggan', r.name], ['Telepon', r.phone], ['Layanan', r.service],
          ['Total Bayar', rupiah(r.price)], ['Status', STATE[r.state].label],
        ].map(([k, v]) => `<dt class="text-slate-500">${k}</dt><dd class="col-span-2 font-semibold">${esc(v)}</dd>`).join('');
        openModal('invoice-modal');
      }
    });

    $search.addEventListener('input', render);
    $filter.addEventListener('change', render);
    document.getElementById('btn-print').addEventListener('click', () => window.print());
    document.getElementById('btn-csv').addEventListener('click', () => {
      downloadCSV('refund-invoice.csv', [
        ['No. Ref', 'Nama', 'Telepon', 'Layanan', 'Harga', 'Status'],
        ...visibleRows().map(r => [r.ref, r.name, r.phone, r.service, r.price, STATE[r.state].label]),
      ]);
    });

    render();
  </script>
</body>
</html>
