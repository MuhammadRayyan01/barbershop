<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services | Pemon Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f8f8fd] text-slate-900">

  <div id="admin-sidebar"></div>
  <div id="admin-topbar"></div>

  <main class="lg:ml-72 px-4 sm:px-8 py-8">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div class="max-w-xl">
        <h1 class="text-2xl sm:text-3xl font-extrabold">Kelola &amp; Perbarui Layanan</h1>
        <p class="text-sm text-slate-500 mt-1">Atur tarif, durasi, dan spesifikasi paket pemotongan rambut untuk ritel kasir serta reservasi daring.</p>
      </div>
      <a href="add-service.html" class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-[#0d3b36] hover:bg-[#082724] text-white text-sm font-bold">
        <span class="material-symbols-outlined text-[18px]">add</span>Tambah Layanan Baru
      </a>
    </div>

    <!-- Pencarian + info -->
    <div class="flex flex-wrap items-center gap-3 mt-6">
      <div class="flex items-center gap-2 bg-white rounded-xl px-4 py-3 flex-1 min-w-[260px] shadow-sm">
        <span class="material-symbols-outlined text-[20px] text-slate-500">search</span>
        <input id="search" type="text" placeholder="Search by name (Cari nama layanan pangkas rambut, cuci, styling...)" class="w-full bg-transparent outline-none text-sm">
        <button id="clear-search" class="hidden text-slate-400 hover:text-slate-700" aria-label="Hapus"><span class="material-symbols-outlined text-[18px]">close</span></button>
      </div>
      <span id="total-chip" class="px-3 py-2 rounded-lg bg-indigo-50 text-xs font-semibold text-slate-700"></span>
      <span class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-emerald-100 text-xs font-semibold text-emerald-900">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-700"></span>Sinkron POS Kasir
      </span>
    </div>

    <!-- Tabel layanan -->
    <section class="bg-white rounded-2xl shadow-sm mt-5 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[760px]">
          <thead class="bg-indigo-50/60 text-[11px] tracking-wider text-slate-500 uppercase">
            <tr>
              <th class="text-left font-semibold px-4 py-3 w-14">#</th>
              <th class="text-left font-semibold px-4 py-3">Service Name</th>
              <th class="text-left font-semibold px-4 py-3">Description</th>
              <th class="text-right font-semibold px-4 py-3">Price</th>
              <th class="text-right font-semibold px-4 py-3">Action</th>
            </tr>
          </thead>
          <tbody id="svc-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Modal Update Layanan -->
  <div id="update-modal" class="modal hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
    <form id="update-form" class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden" novalidate>
      <div class="flex items-center justify-between px-6 py-4 bg-indigo-50/60">
        <h3 class="font-bold text-lg flex items-center gap-2"><span class="material-symbols-outlined">edit_note</span>Update Layanan</h3>
        <button type="button" data-close-modal class="p-1 rounded-lg hover:bg-white/70"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="px-6 py-5 space-y-5">
        <input type="hidden" id="f-id">
        <div>
          <div class="flex justify-between mb-2"><label for="f-name" class="text-sm font-semibold">Service Name</label><span class="text-[11px] text-slate-400">Wajib diisi</span></div>
          <div class="flex items-center gap-3 bg-[#f8f8fd] border border-slate-100 rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-[#0d3b36]/40">
            <span class="material-symbols-outlined text-[20px] text-slate-500">content_cut</span>
            <input id="f-name" type="text" class="w-full bg-transparent outline-none text-sm">
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-2"><label for="f-price" class="text-sm font-semibold">Price</label><span class="text-[11px] px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">Rupiah (IDR)</span></div>
          <div class="flex items-center gap-3 bg-[#f8f8fd] border border-slate-100 rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-[#0d3b36]/40">
            <span class="material-symbols-outlined text-[20px] text-slate-500">payments</span>
            <span class="text-sm text-slate-500">Rp</span>
            <input id="f-price" type="text" inputmode="numeric" class="w-full bg-transparent outline-none text-sm">
          </div>
        </div>
        <div>
          <label for="f-desc" class="text-sm font-semibold block mb-2">Deskripsi Singkat</label>
          <textarea id="f-desc" rows="3" class="w-full bg-[#f8f8fd] border border-slate-100 rounded-xl px-4 py-3 outline-none text-sm focus:ring-2 focus:ring-[#0d3b36]/40"></textarea>
        </div>
        <p id="f-error" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-4 py-2"></p>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2">
        <button type="button" data-close-modal class="px-5 py-2.5 rounded-xl bg-slate-100 text-sm font-semibold text-slate-600 hover:bg-slate-200">Batal</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#0d3b36] hover:bg-[#082724] text-white text-sm font-bold">Update</button>
      </div>
    </form>
  </div>

  <script src="../assets/js/admin.js"></script>
  <script>
    initAdminShell('services', ['Studio Management', 'Administration Portal', 'Services']);

    /* ------------------------------------------------------------
       DATA CONTOH = isi tabel `service` (status = 'active')
       Nanti ganti dengan: fetch('../includes/get_services.php')
       ------------------------------------------------------------ */
    const services = [
      { id: 1, name: 'Classic Haircut',        price: 50000,  desc: 'Potong rambut presisi sesuai kontur wajah, relaksasi hot towel ringan, dan sentuhan matte clay styling.' },
      { id: 2, name: 'Haircut & Deluxe Wash',  price: 65000,  desc: 'Ritual potong detail, keramas scalp cleansing dingin, pijat akupresur pundak & tonik ginseng herbal.' },
      { id: 3, name: 'Shave & Beard Trim',     price: 35000,  desc: 'Cukur kumis & janggut rapi dengan straight razor steril, busa cedarwood hangat, dan balm sandalwood.' },
      { id: 4, name: 'Hair Coloring / Bleaching', price: 120000, desc: 'Pewarnaan rambut profesional (Ash Grey, Espresso Brown, Silver Blonde) menggunakan formula low-ammonia aman di kulit.' },
      { id: 5, name: 'Kids Haircut',           price: 45000,  desc: 'Cukur lembut ramah anak usia 2-11 tahun, gunting anti-tarik, styling baby pomade harum permen karet.' },
      { id: 6, name: 'Paket Ayah & Anak',      price: 90000,  desc: 'Paket bonding 2 kursi berdampingan: 1x Deluxe Haircut Ayah + 1x Kids Haircut plus tonic massage ganda.' },
    ];

    const $body = document.getElementById('svc-body');
    const $search = document.getElementById('search');

    function render() {
      const q = $search.value.trim().toLowerCase();
      document.getElementById('clear-search').classList.toggle('hidden', !q);
      const rows = services.filter(s => !q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));

      $body.innerHTML = rows.length ? rows.map(s => `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-5 text-slate-400">${String(s.id).padStart(2, '0')}</td>
          <td class="px-4 py-5 font-semibold w-52">${esc(s.name)}</td>
          <td class="px-4 py-5 text-xs text-slate-600 max-w-sm">${esc(s.desc)}</td>
          <td class="px-4 py-5 text-right font-bold whitespace-nowrap">${rupiah(s.price)}</td>
          <td class="px-4 py-5">
            <div class="flex items-center justify-end gap-3">
              <button data-act="edit" data-id="${s.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-900 text-xs font-semibold hover:bg-emerald-200">
                <span class="material-symbols-outlined text-[16px]">edit</span>Update</button>
              <button data-act="archive" data-id="${s.id}" class="p-1 text-slate-500 hover:text-red-600" aria-label="Arsipkan" title="Nonaktifkan layanan">
                <span class="material-symbols-outlined text-[20px]">inventory_2</span></button>
            </div>
          </td>
        </tr>`).join('') : `<tr><td colspan="5" class="px-4 py-10 text-center text-slate-500">Layanan tidak ditemukan.</td></tr>`;

      document.getElementById('total-chip').textContent = `Total: ${services.length} Layanan Aktif`;
    }

    $body.addEventListener('click', async e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const s = services.find(x => x.id === Number(btn.dataset.id));

      if (btn.dataset.act === 'edit') {
        document.getElementById('f-id').value = s.id;
        document.getElementById('f-name').value = s.name;
        document.getElementById('f-price').value = s.price.toLocaleString('id-ID');
        document.getElementById('f-desc').value = s.desc;
        document.getElementById('f-error').classList.add('hidden');
        openModal('update-modal');
      }
      if (btn.dataset.act === 'archive') {
        const ok = await confirmDialog({ title: 'Nonaktifkan layanan?', message: `"${s.name}" tidak akan tampil lagi di halaman booking (status menjadi inactive).`, okLabel: 'Nonaktifkan', danger: true });
        if (!ok) return;
        // PHP nanti: UPDATE service SET status='inactive' WHERE service_id=?
        services.splice(services.indexOf(s), 1);
        toast('Layanan dinonaktifkan');
        render();
      }
    });

    // format harga otomatis: 50000 -> 50.000
    document.getElementById('f-price').addEventListener('input', e => {
      const n = digitsOnly(e.target.value);
      e.target.value = n ? n.toLocaleString('id-ID') : '';
    });

    document.getElementById('update-form').addEventListener('submit', e => {
      e.preventDefault();
      const err = document.getElementById('f-error');
      const name = document.getElementById('f-name').value.trim();
      const price = digitsOnly(document.getElementById('f-price').value);
      if (!name || !price) {
        err.textContent = 'Nama layanan dan harga wajib diisi.';
        err.classList.remove('hidden');
        return;
      }
      // PHP nanti: fetch POST ke includes/update_service.php -> UPDATE service SET ... WHERE service_id=?
      const s = services.find(x => x.id === Number(document.getElementById('f-id').value));
      s.name = name; s.price = price; s.desc = document.getElementById('f-desc').value.trim();
      closeModal('update-modal');
      toast('Layanan diperbarui');
      render();
    });

    $search.addEventListener('input', render);
    document.getElementById('clear-search').addEventListener('click', () => { $search.value = ''; render(); });

    render();
  </script>
</body>
</html>
