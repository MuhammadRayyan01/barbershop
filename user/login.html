<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | Pemon Barbershop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f8fd; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-[24px] shadow-sm w-full max-w-[420px] p-8 md:p-10">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-[#e6f4ea] rounded-full flex items-center justify-center mx-auto mb-4 text-[#0d3b36]">
        <span class="material-symbols-outlined text-2xl">content_cut</span>
      </div>
      <p class="text-xs font-bold tracking-widest text-slate-500 uppercase mb-2">Pemon Barbershop</p>
      <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Masuk ke Akun</h1>
      <p class="text-sm text-slate-500">Lanjutkan reservasi perawatan dan jadwal cukur Anda</p>
    </div>

    <!-- Form Login -->
    <form action="#" method="POST" class="space-y-5">
      <!-- Input Email/Phone -->
      <div>
        <label class="block text-sm font-semibold text-slate-900 mb-2">Email atau No. Handphone</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-4 text-slate-400 text-[20px]">person</span>
          <input type="text" placeholder="nama@email.com / 0812..." class="w-full bg-[#f8f8fd] text-sm rounded-xl py-3.5 pl-11 pr-4 outline-none focus:ring-2 focus:ring-[#0d3b36]/20 transition-all text-slate-700 placeholder-slate-400">
        </div>
      </div>

      <!-- Input Password -->
      <div>
        <label class="block text-sm font-semibold text-slate-900 mb-2">Kata Sandi</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-4 text-slate-400 text-[20px]">lock</span>
          <input type="password" id="login-password" placeholder="Masukkan kata sandi" class="w-full bg-[#f8f8fd] text-sm rounded-xl py-3.5 pl-11 pr-11 outline-none focus:ring-2 focus:ring-[#0d3b36]/20 transition-all text-slate-700 placeholder-slate-400">
          <button type="button" onclick="togglePassword('login-password', 'login-eye')" class="absolute right-4 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center">
            <span id="login-eye" class="material-symbols-outlined text-[20px]">visibility_off</span>
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer group">
          <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-[#0d3b36] focus:ring-[#0d3b36] cursor-pointer">
          <span class="text-sm text-slate-600 group-hover:text-slate-900 transition-colors">Ingat saya</span>
        </label>
        <a href="#" class="text-sm font-semibold text-slate-900 hover:text-[#0d3b36] transition-colors">Lupa Password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full bg-[#0d3b36] hover:bg-[#0a2e2a] text-white font-semibold rounded-xl py-3.5 mt-2 flex items-center justify-center gap-2 transition-all">
        Masuk <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>
    </form>

    <!-- Footer Link -->
    <div class="text-center mt-8">
      <p class="text-sm text-slate-600">
        Belum punya akun? <a href="register.html" class="font-bold text-slate-900 hover:text-[#0d3b36]">Daftar sekarang</a>
      </p>
    </div>
  </div>

  <script>
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }
  </script>
</body>
</html>
